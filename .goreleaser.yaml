# Release builds (ADR-0002): binaries for Linux, macOS and Windows, with the
# web UI embedded, SBOMs, a cosign signature over the checksums, and a draft
# GitHub release that a maintainer reviews and publishes. Images and the Helm
# chart are built by the release workflow (.github/workflows/release.yml).
version: 2
project_name: kubexray

before:
  hooks:
    - make web # the UI is embedded in the binary

builds:
  - id: kubexray
    main: ./cmd/kubexray
    binary: kubexray
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/kubexray/kubexray/internal/version.Version={{ .Version }}
      - -X github.com/kubexray/kubexray/internal/version.Commit={{ .FullCommit }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible

archives:
  - id: kubexray
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive # SPDX, one per archive (syft)

signs:
  # Keyless (Sigstore): the signature proves the checksums came from this
  # repository's release workflow. Verify with:
  #   cosign verify-blob --bundle checksums.txt.sigstore.json \
  #     --certificate-identity-regexp '^https://github.com/kubexray/kubexray/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

homebrew_casks:
  - name: kubexray
    repository:
      owner: kubexray
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    homepage: https://github.com/kubexray/kubexray
    description: The flight recorder for your Kubernetes cluster
    license: MIT
    # The binary isn't notarized by Apple: clear the quarantine flag macOS
    # sets on downloads, as GoReleaser documents for casks.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kubexray"]
          end
    # Until the tap repository and its token exist, the cask isn't published.
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude: ['^docs:', '^test:', '^ci:', '^chore\(deps\)', 'Merge pull request', 'Merge branch']

release:
  draft: true # reviewed and published by a maintainer
  prerelease: auto
  name_template: "kubexray {{ .Version }}"
  footer: |
    **Verify**: `cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity-regexp '^https://github.com/kubexray/kubexray/' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`, then `sha256sum -c checksums.txt`.
    Images: `ghcr.io/kubexray/kubexray:{{ .Version }}` (signed; verify with `cosign verify`). Helm chart: `oci://ghcr.io/kubexray/charts/kubexray`.
