# kubexray in the cluster (ADR-0010): records around the clock, keeps history
# on disk, and serves the UI behind authentication. There's no anonymous mode.

image:
  repository: ghcr.io/kubexray/kubexray
  tag: ""  # default: the chart's appVersion
  pullPolicy: IfNotPresent

auth:
  # token: every request needs the token from the kubexray Secret. Open
  #   /?token=<token> once in a browser; API clients send it as a Bearer token.
  # oidc: people sign in as themselves with your OpenID Connect provider
  #   (Google, Okta, Entra ID, Keycloak, Dex, Auth0), and auth.allow decides
  #   who gets in (ADR-0013). Needs an https publicURL or an Ingress with TLS.
  #   API clients and Alertmanager keep using the token.
  # proxy: kubexray listens on 127.0.0.1 inside the pod, and the sidecar below
  #   (oauth2-proxy or similar) is the only way in.
  mode: token
  # A Secret with the token under the key "token" (at least 32 characters),
  # and with mode oidc the key that signs sessions under "session-key" (at
  # least 32 characters). Empty: the chart generates them and keeps them
  # across helm upgrades. With GitOps (Argo CD, Flux) or helm template, which
  # can't look up the existing Secret, set your own here. kubexray follows
  # changes to the token; a new session key signs everyone out.
  existingSecret: ""
  oidc:
    # Register kubexray with the provider as a web application with the
    # redirect URL https://<your host>/auth/callback, then fill these in.
    issuer: ""      # e.g. https://accounts.google.com, https://<org>.okta.com
    clientId: ""
    clientSecret:
      existingSecret: ""  # a Secret holding the client secret
      key: client-secret
    scopes: []            # besides openid, email and profile; e.g. [groups]
    groupsClaim: groups   # the ID token claim listing someone's groups
    # The claim your cluster's API server takes as the username (its
    # --oidc-username-claim), for diffs.access: kubernetes.
    usernameClaim: email
    # Email and domain rules need the provider to say the email is verified.
    # Microsoft Entra ID doesn't, so with Entra allow groups (object IDs).
    sessionTTL: 12h       # how long a sign-in lasts
  # Who gets in with mode oidc: at least one rule. Signing in alone isn't
  # enough; with Google it would let in anyone with a Google account.
  allow:
    emails: []   # e.g. [ada@example.com]
    domains: []  # everyone with a verified email here, e.g. [example.com]
    groups: []   # members of these groups (from groupsClaim)
  proxy:
    # The auth proxy container, used when mode is proxy. It must forward to
    # http://127.0.0.1:8080 and listen on proxy.port.
    sidecar: {}
    port: 4180

rbac:
  # Watching Secrets (as metadata only) lets kubexray report Secret edits and
  # missing Secrets as causes, but RBAC can't limit "list secrets" to
  # metadata: it grants read access to every Secret's contents. Off by default.
  secrets: false

diffs:
  # Keep ConfigMap and environment values so diffs show them, like
  # "LOG_LEVEL info → verbose" (ADR-0017). Values whose name or contents look
  # like a credential are hidden, Secrets are never read, and replays and
  # alerts leave values out unless someone chooses to include them. Off:
  # names and fingerprints only, "LOG_LEVEL changed".
  values: true
  # Custom resources to keep a history of, besides the built-in kinds
  # (ADR-0018), as group/version/resource. The chart grants read access to
  # each. For example:
  #   - argoproj.io/v1alpha1/applications
  #   - gateway.networking.k8s.io/v1/httproutes
  extraResources: []
  # Who sees values:
  # all: everyone who can sign in.
  # kubernetes: only people Kubernetes lets read ConfigMaps in the namespace,
  #   asked with a SubjectAccessReview (ADR-0020). Needs auth.mode oidc, with
  #   the same OpenID Connect provider your cluster's API server trusts, so
  #   people are the same users and groups to both. The chart lets kubexray
  #   create SubjectAccessReviews.
  access: all
  # What the API server puts before OIDC usernames and groups (its
  # --oidc-username-prefix and --oidc-groups-prefix), with access kubernetes.
  kubeUsernamePrefix: ""
  kubeGroupsPrefix: ""

signals:
  # Where to read request errors and latency (ADR-0016). Empty: kubexray
  # looks for a Service named prometheus or prometheus-server, or labelled
  # app.kubernetes.io/name=prometheus, and calls it directly. If Prometheus
  # has a NetworkPolicy, let kubexray's pods reach its port.
  prometheusURL: ""   # e.g. http://prometheus.monitoring.svc:9090

persistence:
  # History on a volume, so it survives restarts. Without it, history lives in
  # the pod's memory and starts over when the pod does.
  enabled: true
  size: 2Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

# How long history is kept, and the disk it may use (keep it below the volume
# size). The oldest history goes first.
retention: 168h
retentionSizeMB: 1024

# The cluster's name in shared replays. Default: "in-cluster".
clusterName: ""

# Where people open kubexray, for links in alerts. Default: the Ingress host
# (https when it has TLS).
publicURL: ""

alerts:
  # kubexray as an Alertmanager receiver (ADR-0011): firing alerts about an
  # app are sent on with kubexray's diagnosis, the likely cause, who made the
  # change and a link to the moment it started. Webhook URLs are credentials,
  # so they come from Secrets. Point Alertmanager at kubexray with:
  #
  #   receivers:
  #     - name: kubexray
  #       webhook_configs:
  #         - url: http://<release>-kubexray.<namespace>.svc/api/alertmanager
  #           http_config:
  #             authorization:
  #               credentials_file: /etc/alertmanager/secrets/kubexray/token
  slack:
    existingSecret: ""  # a Secret holding a Slack incoming webhook URL
    key: url
  webhook:
    existingSecret: ""  # a Secret holding a URL that receives JSON
    key: url

service:
  type: ClusterIP
  port: 80

ingress:
  # Exposing kubexray: put it behind TLS. The token still protects it.
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []  # e.g. [{secretName: kubexray-tls, hosts: [kubexray.example.com]}]

networkPolicy:
  # Allow traffic to kubexray's port only from these sources (NetworkPolicy
  # "from" entries). Empty with enabled: true allows only pods in the same
  # namespace.
  enabled: false
  from: []

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
