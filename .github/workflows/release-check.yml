name: Release check

# The release pipeline is tested before a tag needs it: a snapshot build of
# every binary and SBOM, the multi-arch image, the chart package and the
# Homebrew cask, without publishing. Signing and attestations need a real
# release's identity, so they only run on tags.
on:
  pull_request:
    paths: &paths
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-check.yml"
      - ".github/workflows/homebrew.yml"
      - ".github/homebrew/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "charts/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/.nvmrc"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the build cache below holds every platform's
      # Six platforms rebuild the Kubernetes libraries each time without it.
      # Saved every run, restored from the newest: compiled packages are
      # keyed by their inputs, so a stale entry is never used wrongly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: snapshot-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            snapshot-${{ hashFiles('go.sum') }}-
            snapshot-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign # signing needs a release's identity
      - name: The archives contain a working binary
        run: |
          tar -xzf dist/kubexray_*_linux_amd64.tar.gz -C dist kubexray
          dist/kubexray version
          ls dist/*.sbom.json
      - name: The Homebrew cask renders from the checksums
        run: |
          version="$(sed -n 's/.*kubexray_\(.*\)_linux_amd64.tar.gz$/\1/p' dist/checksums.txt)"
          .github/homebrew/render.sh "$version" dist/checksums.txt > dist/kubexray.rb
          cat dist/kubexray.rb
          ruby -c dist/kubexray.rb
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: The chart packages
        run: |
          helm lint --strict charts/kubexray
          helm package charts/kubexray --version 0.0.0-check --app-version 0.0.0-check --destination dist

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # Reused between PR builds; releases build without it.
          cache-from: type=gha
          cache-to: type=gha,mode=max
