name: Release check

# The release pipeline is tested before a tag needs it: a snapshot build of
# every binary and SBOM, the multi-arch image, the chart package and the
# Homebrew cask, without publishing. Signing and attestations need a real
# release's identity, so they only run on tags.
on:
  pull_request:
    paths: &paths
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-check.yml"
      - ".github/workflows/homebrew.yml"
      - ".github/homebrew/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "charts/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/.nvmrc"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.54.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign # signing needs a release's identity
      - name: The archives contain a working binary
        run: |
          tar -xzf dist/kubexray_*_linux_amd64.tar.gz -C dist kubexray
          dist/kubexray version
          ls dist/*.sbom.json
      - name: The Homebrew cask renders from the checksums
        run: |
          version="$(sed -n 's/.*kubexray_\(.*\)_linux_amd64.tar.gz$/\1/p' dist/checksums.txt)"
          .github/homebrew/render.sh "$version" dist/checksums.txt > dist/kubexray.rb
          cat dist/kubexray.rb
          ruby -c dist/kubexray.rb
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: The chart packages
        run: |
          helm lint --strict charts/kubexray
          helm package charts/kubexray --version 0.0.0-check --app-version 0.0.0-check --destination dist

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
