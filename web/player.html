<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Static hosting can't send headers, so the policy is set here too
         (ADR-0008): code only from this site, replays from https links. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="description" content="Watch a Kubernetes incident as it happened: what changed, what broke, and why. The kubexray replay player." />
    <title>kubexray player</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta property="og:title" content="kubexray player: watch a Kubernetes incident as it happened" />
    <meta property="og:description" content="What changed, what broke, and why, played back in your browser. No install, no cluster." />
    <meta property="og:image" content="https://kubexray.com/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="./theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/player-main.tsx"></script>
  </body>
</html>
