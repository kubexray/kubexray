{{- $proxy := eq .Values.auth.mode "proxy" }}
{{- $oidc := eq .Values.auth.mode "oidc" }}
{{- $publicURL := include "kubexray.publicURL" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubexray.fullname" . }}
  labels: {{- include "kubexray.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One recorder per cluster, and the volume is ReadWriteOnce.
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "kubexray.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kubexray.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubexray.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kubexray
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen={{ if $proxy }}127.0.0.1{{ end }}:8080
            {{- if $proxy }}
            - --auth=none
            {{- else }}
            - --token-file=/etc/kubexray/token
            {{- end }}
            {{- if $oidc }}
            {{- with .Values.auth.oidc }}
            - --auth=oidc
            - {{ printf "--oidc-issuer=%s" .issuer | quote }}
            - {{ printf "--oidc-client-id=%s" .clientId | quote }}
            - --oidc-client-secret-file=/etc/kubexray-oidc/client-secret
            - {{ printf "--oidc-groups-claim=%s" (.groupsClaim | default "groups") | quote }}
            - {{ printf "--oidc-username-claim=%s" (.usernameClaim | default "email") | quote }}
            - --session-key-file=/etc/kubexray/session-key
            - {{ printf "--session-ttl=%s" (.sessionTTL | default "12h") | quote }}
            {{- range .scopes }}
            - {{ printf "--oidc-scope=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.auth.allow }}
            {{- range .emails }}
            - {{ printf "--allow-email=%s" . | quote }}
            {{- end }}
            {{- range .domains }}
            - {{ printf "--allow-domain=%s" . | quote }}
            {{- end }}
            {{- range .groups }}
            - {{ printf "--allow-group=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - --data-dir=/data
            - --retention-size-mb={{ .Values.retentionSizeMB }}
            {{- end }}
            - --retention={{ .Values.retention }}
            {{- if not .Values.rbac.secrets }}
            - --no-secrets
            {{- end }}
            - --values={{ .Values.diffs.values }}
            {{- with .Values.signals.prometheusURL }}
            - {{ printf "--prometheus-url=%s" . | quote }}
            {{- end }}
            {{- if eq .Values.diffs.access "kubernetes" }}
            {{- if ne .Values.auth.mode "oidc" }}
            {{- fail "diffs.access: kubernetes needs auth.mode: oidc" }}
            {{- end }}
            - --values-access=kubernetes
            - {{ printf "--kube-username-prefix=%s" .Values.diffs.kubeUsernamePrefix | quote }}
            - {{ printf "--kube-groups-prefix=%s" .Values.diffs.kubeGroupsPrefix | quote }}
            {{- end }}
            {{- range .Values.diffs.extraResources }}
            - {{ printf "--resource=%s" . | quote }}
            {{- end }}
            {{- with .Values.clusterName }}
            - --cluster-name={{ . }}
            {{- end }}
            {{- with $publicURL }}
            - --public-url={{ . }}
            {{- end }}
            {{- if .Values.alerts.slack.existingSecret }}
            - --slack-webhook-file=/etc/kubexray-alerts/slack/url
            {{- end }}
            {{- if .Values.alerts.webhook.existingSecret }}
            - --webhook-url-file=/etc/kubexray-alerts/webhook/url
            {{- end }}
            {{- if and .Values.ingress.enabled .Values.ingress.host }}
            - --allowed-host={{ .Values.ingress.host }}
            {{- if .Values.ingress.tls }}
            - --secure-cookie
            {{- end }}
            {{- end }}
          {{- if not $proxy }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- end }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if not $proxy }}
            - {name: token, mountPath: /etc/kubexray, readOnly: true}
            {{- end }}
            {{- if $oidc }}
            - {name: oidc, mountPath: /etc/kubexray-oidc, readOnly: true}
            {{- end }}
            {{- if .Values.alerts.slack.existingSecret }}
            - {name: slack, mountPath: /etc/kubexray-alerts/slack, readOnly: true}
            {{- end }}
            {{- if .Values.alerts.webhook.existingSecret }}
            - {name: webhook, mountPath: /etc/kubexray-alerts/webhook, readOnly: true}
            {{- end }}
        {{- if $proxy }}
        - {{- toYaml .Values.auth.proxy.sidecar | nindent 10 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "kubexray.fullname" . }}}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if not $proxy }}
        - name: token
          secret:
            secretName: {{ include "kubexray.tokenSecret" . }}
            items:
              - {key: token, path: token}
              {{- if $oidc }}
              - {key: session-key, path: session-key}
              {{- end }}
        {{- end }}
        {{- if $oidc }}
        {{- with .Values.auth.oidc.clientSecret }}
        - name: oidc
          secret: {secretName: {{ .existingSecret }}, items: [{key: {{ .key }}, path: client-secret}]}
        {{- end }}
        {{- end }}
        {{- with .Values.alerts.slack }}
        {{- if .existingSecret }}
        - name: slack
          secret: {secretName: {{ .existingSecret }}, items: [{key: {{ .key }}, path: url}]}
        {{- end }}
        {{- end }}
        {{- with .Values.alerts.webhook }}
        {{- if .existingSecret }}
        - name: webhook
          secret: {secretName: {{ .existingSecret }}, items: [{key: {{ .key }}, path: url}]}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
