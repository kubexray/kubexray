{{- include "kubexray.validate" . }}
{{- if and (has .Values.auth.mode (list "token" "oidc")) (not .Values.auth.existingSecret) }}
{{- $name := include "kubexray.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "kubexray.labels" . | nindent 4 }}
type: Opaque
data:
  # Generated once and kept across upgrades.
  token: {{ if and $existing $existing.data $existing.data.token }}{{ $existing.data.token }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  {{- if eq .Values.auth.mode "oidc" }}
  # Signs sessions; a new one signs everyone out.
  session-key: {{ if and $existing $existing.data (index $existing.data "session-key") }}{{ index $existing.data "session-key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  {{- end }}
{{- end }}
