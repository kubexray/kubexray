{{- include "kubexray.validate" . }}
{{- if and (eq .Values.auth.mode "token") (not .Values.auth.existingSecret) }}
{{- $name := include "kubexray.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "kubexray.labels" . | nindent 4 }}
type: Opaque
data:
  # Generated once and kept across upgrades.
  token: {{ if and $existing $existing.data $existing.data.token }}{{ $existing.data.token }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
