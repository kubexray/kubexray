{{- $labels := dict "app" "storefront" "app.kubernetes.io/managed-by" "Helm" "helm.sh/chart" (printf "storefront-%s" .Values.release) "app.kubernetes.io/version" .Values.release }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: storefront}}
  template:
    metadata:
      labels: {app: storefront}
    spec:
      containers:
        - name: storefront
          image: {{ .Values.image }}
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  selector: {app: storefront}
  ports: [{port: 80}]
